name: Publish packaged builds for mirror downloads

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-release.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: nexus-0-2-0-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download verified Windows and Linux build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 41327360068 --repo "$GITHUB_REPOSITORY" --name NexusMCP-Studio-Windows-x64 --dir dist/windows
          gh run download 41327360052 --repo "$GITHUB_REPOSITORY" --name NexusMCP-Studio-Linux-x64 --dir dist/linux
          echo "Verified packaged files:"
          find dist -type f -printf '%P %s bytes\n'

      - name: Publish version 0.2.0 files as public Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find dist -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.tar.gz' -o -name '*.zip' \) -print0)
          if [ "${#files[@]}" -lt 4 ]; then
            echo "Missing expected binaries in the workflow artifacts" >&2
            exit 1
          fi
          printf 'Release assets: %s\n' "${files[@]}"
          gh release create v0.2.0 "${files[@]}" --repo "$GITHUB_REPOSITORY" \
            --target cc9f2b442ad25b2ec8ce4863ca40ee9f89c1d7db \
            --title "NexusMCP Studio 0.2.0" \
            --notes "Windows x64 installer, Linux x64 AppImage and DEB, Linux standalone MCP service and browser extension. Built by successful GitHub Actions workflows on commit cc9f2b4. Downloaded from the verified workflow artifacts. Test the packages on your target system before production use."
