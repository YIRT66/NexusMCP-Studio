name: Mobile preview (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nexus-mobile-pages
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build web preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install frontend dependencies (without Electron download)
        run: npm ci --ignore-scripts
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build static UI (no PC or MCP backend)
        env:
          GITHUB_PAGES: 'true'
          VITE_WEB_PREVIEW: 'true'
          VITE_RUNTIME_ENABLED: 'false'
        run: npm run build
      - name: Prepare Pages
        uses: actions/configure-pages@v5
      - name: Upload UI artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    name: Publish phone preview
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
