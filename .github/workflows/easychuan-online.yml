name: Temporary Easychuan online transfer
on:
  push:
    branches: [ops/easychuan-0-3-3]
  workflow_dispatch:
    inputs:
      public_key:
        description: RSA public key (DER base64) for the private transfer link
        required: true
permissions:
  contents: read
concurrency:
  group: nexus-easychuan-online
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install playwright-core install --with-deps chromium
      - name: Download the verified Windows release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p transfer
          version="v$(node -p 'require("./package.json").version')"
          gh release download "$version" --repo "$GITHUB_REPOSITORY" --pattern NexusMCP-Studio-Setup.exe --pattern SHA256SUMS.txt --dir transfer
          cd transfer
          rg 'NexusMCP-Studio-Setup.exe$' SHA256SUMS.txt | sha256sum -c -
      - name: Verify online transfer with a small fixture
        if: github.event_name == 'push'
        env:
          TRANSFER_SMOKE: '1'
        run: |
          mkdir -p transfer
          echo 'Nexus transfer integration fixture. Not an installer.' > transfer/Nexus-transfer-test.txt
          node scripts/share-easychuan-online.mjs transfer/Nexus-transfer-test.txt
      - name: Start the online sender and verify a received copy
        if: github.event_name == 'workflow_dispatch'
        env:
          TRANSFER_PUBLIC_KEY: ${{ inputs.public_key }}
        run: |
          node scripts/share-easychuan-online.mjs transfer/NexusMCP-Studio-Setup.exe > transfer/sender.log 2>&1 &
          echo $! > transfer/sender.pid
          for attempt in $(seq 1 360); do
            if test -f transfer/online-link.enc; then exit 0; fi
            if ! kill -0 "$(cat transfer/sender.pid)" 2>/dev/null; then cat transfer/sender.log; exit 1; fi
            sleep 2
          done
          cat transfer/sender.log
          exit 1
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: easychuan-online-link
          path: transfer/online-link.enc
          retention-days: 1
      - name: Keep the sender online
        if: github.event_name == 'workflow_dispatch'
        run: |
          while kill -0 "$(cat transfer/sender.pid)" 2>/dev/null; do sleep 15; done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: easychuan-diagnostics
          path: |
            transfer/sender.log
            transfer/easychuan-error.png
          retention-days: 1
