<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>NexusMCP 浏览器扩展</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="icon-link" viewBox="0 0 24 24"><path d="m10 13 4-4m-6 6-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m2 2 1-1a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0"/></symbol>
<symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10"/></symbol>
<symbol id="icon-send" viewBox="0 0 24 24"><path d="m12 19 0-14m-6 6 6-6 6 6"/></symbol>
<symbol id="icon-chat" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 1-8 8H4l1-4a8 8 0 1 1 15-4Z"/><path d="M8 10h8m-8 4h5"/></symbol>
<symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
</defs></svg>
<header class="app-header">
 <div class="brand"><span class="brand-mark" aria-hidden="true">N<span>↗</span></span><div><h1>NexusMCP<span>浏览器助手</span></h1><p>连接桌面，继续对话。</p></div></div>
 <span id="connection" class="status-badge" role="status" data-status="checking">检查中</span>
</header>
<main>
 <section class="connection-card" aria-label="客户端连接">
  <div class="section-heading"><svg aria-hidden="true"><use href="#icon-link"/></svg><h2>桌面连接</h2><span class="local-label">仅限本机</span></div>
  <p id="connection-description">正在检查桌面客户端…</p>
  <details id="connection-settings" open>
   <summary>连接设置<svg aria-hidden="true"><use href="#icon-chevron"/></svg></summary>
   <form id="connection-form">
    <label for="endpoint">扩展连接地址</label>
    <div class="input-row"><input id="endpoint" type="text" placeholder="粘贴客户端提供的 ws://127.0.0.1:…" spellcheck="false" autocomplete="off" aria-describedby="endpoint-hint"><button class="primary" id="connect" type="submit">连接</button></div>
    <p class="field-hint" id="endpoint-hint">在客户端「AI 浏览器」中复制扩展连接地址。</p>
   </form>
   <button class="text-button" id="disconnect" type="button" hidden>断开连接</button>
  </details>
 </section>
 <section class="session-section" aria-label="软件当前聊天">
  <div class="section-heading"><h2>当前会话</h2><span id="provider" class="provider-label">尚未绑定</span></div>
  <div class="session-card"><span class="session-icon"><svg aria-hidden="true"><use href="#icon-chat"/></svg></span><div class="session-content"><strong id="session-title">让对话接着发生</strong><p id="binding">连接客户端后，在软件中为当前聊天打开 AI 网页。</p></div></div>
  <button class="session-open" id="open-binding" type="button" hidden>打开会话网页<svg aria-hidden="true"><use href="#icon-arrow"/></svg></button>
 </section>
 <div id="notice" class="notice" role="alert" hidden><span id="notice-text"></span><button id="dismiss-notice" type="button" aria-label="关闭提示">×</button></div>
 <details class="page-section" id="page-tools">
  <summary><span>直接操作当前网页<small>独立于客户端会话</small></span><svg aria-hidden="true"><use href="#icon-chevron"/></svg></summary>
  <div class="page-tools-content">
   <div class="page-status"><span class="status-dot" id="page-dot"></span><span id="state" role="status">正在检查当前网页…</span></div>
   <label class="sr-only" for="text">发送到当前标签页的消息</label>
   <div class="composer"><textarea id="text" placeholder="向当前 AI 网页发送消息…" rows="3" aria-describedby="compose-hint"></textarea><div class="composer-actions"><span id="compose-hint">Ctrl / ⌘ + Enter 发送</span><button id="stop" type="button" disabled>停止</button><button class="primary send-button" id="send" type="button" disabled aria-label="发送到当前网页" title="发送到当前网页"><svg aria-hidden="true"><use href="#icon-send"/></svg></button></div></div>
   <div id="reply-section" class="reply-section" hidden><div class="reply-heading"><span>网页最新回复</span><button id="copy-reply" class="text-button" type="button">复制</button></div><pre id="reply" tabindex="0" aria-label="网页最新回复"></pre></div>
  </div>
 </details>
</main>
<footer><span class="footer-dot" aria-hidden="true"></span>使用你已登录的 AI 网页<span>无需 API Key</span></footer>
<script src="popup.js"></script>
</body>
</html>
