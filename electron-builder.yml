appId: com.nexusmcp.studio
productName: NexusMCP Studio
directories:
  output: release
files:
  - desktop/**/*
  - frontend/dist/**/*
  - browser-plugin/**/*
  - package.json
  - '!node_modules/**/*'
npmRebuild: false
electronDist: node_modules/electron/dist
asar: true
extraResources:
  - from: browser-plugin
    to: browser-plugin
    filter: ['**/*']
  - from: release/NexusMCP-Service
    to: service
    filter: ['**/*']
win:
  target:
    - target: nsis
      arch: [x64]
  executableName: NexusMCP Studio
  icon: frontend/public/icon.ico
  signAndEditExecutable: true
portable:
  artifactName: NexusMCP-Studio.exe
nsis:
  artifactName: NexusMCP-Studio-Setup.exe
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NexusMCP Studio
  deleteAppDataOnUninstall: false

linux:
  icon: frontend/public/icon.png
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  executableName: nexusmcp-studio
  category: Development
  maintainer: NexusMCP Studio
  artifactName: NexusMCP-Studio-${version}-${arch}.${ext}
  desktop:
    entry:
      Name: NexusMCP Studio
      Comment: Local MCP service and AI browser workspace
      Terminal: 'false'
